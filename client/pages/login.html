<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção Sync</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="overlay"></div>

    <div class="container-fluid h-100">

        <div class="row h-100 justify-content-center align-items-center">

            <div class="col-lg-5 col-md-8">

                <div class="login-card">

                    <div class="text-center">

                        <div class="logo-container">

                            <i class="fa-solid fa-gears logo-icon"></i>

                        </div>

                        <h1 class="system-title">
                            Manutenção <span>Sync</span>
                        </h1>

                        <p class="subtitle">
                            Plataforma de Sincronização e Monitoramento de
Manutenção
                        </p>

                    </div>

                    <form id="loginForm">

                        <div class="mb-4">

                            <label class="form-label">
                                Usuário
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fa-solid fa-user"></i>
                                </span>

                                <input
                                    id="usuario"
                                    type="text"
                                    class="form-control"
                                    placeholder="Digite seu usuário"
                                    required>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Senha
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fa-solid fa-lock"></i>
                                </span>

                                <input
                                    id="password"
                                    type="password"
                                    class="form-control"
                                    placeholder="Digite sua senha"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="togglePassword()">

                                    <i id="eye"
                                        class="fa-solid fa-eye"></i>

                                </button>

                            </div>

                        </div>

                        <div class="d-flex justify-content-between mb-4">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox">

                                <label class="form-check-label">
                                    Lembrar acesso
                                </label>

                            </div>

                            <a href="#" class="forgot-link">
                                Esqueci minha senha
                            </a>

                        </div>

                        <div id="mensagemErro" class="alert alert-danger d-none mb-3 py-2 text-center" role="alert"></div>

                        <button
                            id="btnEntrar"
                            type="submit"
                            class="btn btn-login w-100">

                            Entrar
                            <i class="fa-solid fa-arrow-right ms-2"></i>

                        </button>

                    </form>

                    <div class="divider">

                        <span>ou</span>

                    </div>

                    <div class="footer">

                        © 2026 Manutenção Sync.
                        Todos os direitos reservados.

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="../js/login.js"></script>

</body>

</html>
