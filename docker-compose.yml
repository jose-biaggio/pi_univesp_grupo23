services:
  db:
    image: mariadb:10.11
    container_name: manutencao_sync_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${DB_NAME:-manutencao_sync}
      MARIADB_USER: ${DB_USER:-sync_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-sync_password}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    healthcheck:
      test: [ "CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: manutencao_sync_backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-sync_user}
      DB_PASSWORD: ${DB_PASSWORD:-sync_password}
      DB_NAME: ${DB_NAME:-manutencao_sync}
      DATABASE_URL: mysql+pymysql://${DB_USER:-sync_user}:${DB_PASSWORD:-sync_password}@db:3306/${DB_NAME:-manutencao_sync}?charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: manutencao_sync_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  mariadb_data:
    driver: local

networks:
  app_network:
    driver: bridge
